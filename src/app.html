<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- <link rel="icon" href="%sveltekit.assets%/favicon.png" /> -->
    <link
      rel="icon"
      type="image/png"
      href="https://cdn1.medicine.yale.edu/icons/ysph/favicon-16x16.png"
      sizes="16x16"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The site's type. Here and not in app.css, so the browser asks for it while the stylesheet is
         still on its way, over connections it has already opened. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:ital,wght@0,300..800;1,300..800&display=swap"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
